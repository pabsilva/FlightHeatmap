<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portugal Flight Noise Map</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.css" rel="stylesheet" />
  <link href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.3/mapbox-gl-geocoder.css" rel="stylesheet" />
  <link href="style.css" rel="stylesheet" />
</head>
<body>
  <div id="map"></div>
  <div id="search"></div>

  <aside id="panel">
    <h1>Flight noise map · Portugal</h1>
    <p id="summary" class="muted">Loading data…</p>

    <label>Show
      <select id="metric">
        <option value="noise">Noise exposure (altitude-weighted)</option>
        <option value="b1500">Flights below 1,500 m / 5,000 ft</option>
        <option value="b3000">Flights below 3,000 m / 10,000 ft</option>
        <option value="all">All flights (any altitude)</option>
      </select>
    </label>

    <div class="row">
      <label>View
        <select id="view">
          <option value="heatmap">Heatmap</option>
          <option value="grid">Grid (exact ~1 km cells)</option>
        </select>
      </label>
      <label>Base map
        <select id="style">
          <option value="mapbox://styles/mapbox/light-v11">Light</option>
          <option value="mapbox://styles/mapbox/streets-v12">Streets</option>
          <option value="mapbox://styles/mapbox/satellite-streets-v12">Satellite</option>
        </select>
      </label>
    </div>

    <label>Opacity <input id="opacity" type="range" min="0.1" max="1" step="0.05" value="0.7" /></label>
    <label id="intensityWrap">Heatmap intensity <input id="intensity" type="range" min="0.05" max="1.5" step="0.05" value="0.3" /></label>

    <div class="legend">
      <div class="bar"></div>
      <div class="legend-labels"><span id="legendLo">less</span><span id="legendHi">more</span></div>
      <p class="muted small" id="legendNote"></p>
    </div>

    <div id="info" class="info muted">Click anywhere on the map, search an address or use your location (◎ button) to see the air traffic at that spot.</div>
  </aside>

  <script src="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.js"></script>
  <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.3/mapbox-gl-geocoder.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
